name: Build Desktop Apps

on:
  push:
    branches:
      - main
      - codex/v1.10.5-remix-release
      - codex/style-presets-workflow-lab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop packages
        run: npm run dist:desktop

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcanvas-${{ matrix.platform }}-${{ github.ref_name }}
          path: release/*
